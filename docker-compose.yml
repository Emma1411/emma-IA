version: '3.8'

services:
  emma-ia:
    build: .
    container_name: emma-ia-service
    ports:
      - "8001:8001"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - EMMA_HOST=0.0.0.0
      - EMMA_PORT=8001
      - EMMA_DEBUG=false
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - emma-network

networks:
  emma-network:
    driver: bridge